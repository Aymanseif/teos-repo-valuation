name: 'TEOS Sovereign Repo Valuation'
description: 'Value your GitHub repo as asset - Score 0-100 + dollar estimation. Deterministic, no LLM.'
author: 'Elmahrosa'
branding:
  icon: 'dollar-sign'
  color: 'green'
inputs:
  github-token:
    description: 'GITHUB_TOKEN'
    required: false
    default: ${{ github.token }}
outputs:
  score:
    description: 'TEOS Score 0-100'
    value: ${{ steps.valuation.outputs.score }}
  valuation:
    description: 'Estimated range'
    value: ${{ steps.valuation.outputs.valuation }}
  decision:
    description: 'ALERT/LOG/IGNORE'
    value: ${{ steps.valuation.outputs.decision }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Run TEOS Valuation
      id: valuation
      shell: bash
      # Composite run steps execute in the CALLER's workspace by default; the action's own
      # sources live under github.action_path, so build/run from there.
      working-directory: ${{ github.action_path }}
      run: dotnet run --project src/Teos.RepoValuation/Teos.RepoValuation.csproj -- smoke